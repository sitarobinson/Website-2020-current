    <!-- Hides the prerendered crawler fallback in #sr-content without hiding it
         from assistive tech.  Inlined so it applies before the CSS bundle loads. -->
    <style>
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>

    <script>
      (function () {
        var saved;
        try { saved = localStorage.getItem("theme"); } catch (e) {}
        document.documentElement.dataset.theme =
          saved === "dark" || saved === "light" ? saved
          : window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      })();
    </script>
